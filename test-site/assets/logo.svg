<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c63ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4aa;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer circle -->
  <circle cx="40" cy="40" r="36" fill="none" stroke="url(#grad)" stroke-width="3"/>
  <!-- Chain link left -->
  <rect x="14" y="33" width="20" height="14" rx="7" fill="none" stroke="url(#grad)" stroke-width="2.5"/>
  <!-- Chain link right -->
  <rect x="46" y="33" width="20" height="14" rx="7" fill="none" stroke="url(#grad)" stroke-width="2.5"/>
  <!-- Center connector -->
  <line x1="34" y1="40" x2="46" y2="40" stroke="url(#grad)" stroke-width="2.5"/>
  <!-- W letter -->
  <text x="40" y="58" font-family="monospace" font-size="10" font-weight="bold" fill="url(#grad)" text-anchor="middle">WC</text>
</svg>
